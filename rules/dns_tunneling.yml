title: Potential DNS Tunneling Activity
id: 8f2b1c4a-9d3e-4f5a-b7c1-2e8a6d4f0a11
status: test
description: Detects potential DNS tunneling (T1071.004) via abnormally long DNS TXT queries or high-entropy query names.
author: Purple Team Framework
date: 2026/10/24
tags:
  - attack.command-and-control
  - attack.t1071.004
logsource:
  product: windows
  category: dns_query
detection:
  selection:
    EventID: 22
    QueryName|re: '^[A-Za-z0-9+/=]{60,}$'
  long_txt:
    EventID: 22
    QueryType: 'TXT'
    QueryName|contains:
      - '....................'  # 20+ char single label placeholder, tune to environment
  condition: selection or long_txt
falsepositives:
  - Legitimate services using long TXT records (e.g., SPF, DKIM lookups)
  - DNS-based threat intel / reputation lookups
level: high
