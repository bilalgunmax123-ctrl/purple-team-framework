title: Suspicious Scheduled Task Creation
id: 9e5f2a7b-4c1d-4a8e-b2f6-1d3c5e7a9b33
status: test
description: Detects scheduled-task persistence (T1053.005) via schtasks.exe creation commands or Security log task-registration events.
author: Purple Team Framework
date: 2026/10/24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  schtasks_create:
    EventID: 1
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
      - '/create'
      - '/tn'
  security_event:
    EventID: 4698
  condition: schtasks_create or security_event
falsepositives:
  - Legitimate software installers and updaters registering tasks
  - Administrative automation
level: medium
