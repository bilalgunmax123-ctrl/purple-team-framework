title: Potential Process Injection via Suspicious Handle Access
id: 3c7e9b2d-1a4f-4e8c-a5d6-7b2f9e0c4d22
status: test
description: Detects potential process injection (T1055) via Sysmon Event 10 with access masks commonly used for memory injection primitives.
author: Purple Team Framework
date: 2026/10/24
tags:
  - attack.defense-evasion
  - attack.privilege-escalation
  - attack.t1055
logsource:
  product: windows
  category: process_access
detection:
  selection:
    EventID: 10
    GrantedAccess:
      - '0x1010'   # PROCESS_VM_WRITE | PROCESS_VM_OPERATION
      - '0x1410'   # + PROCESS_VM_READ
      - '0x1438'   # + PROCESS_QUERY_INFORMATION
      - '0x143a'   # + PROCESS_QUERY_LIMITED_INFORMATION
      - '0x1fffff' # PROCESS_ALL_ACCESS
      - '0x40'     # PROCESS_DUP_HANDLE (often paired with injection)
  filter_legit:
    SourceImage|endswith:
      - '\csrss.exe'
      - '\services.exe'
      - '\lsass.exe'
      - '\wininit.exe'
  condition: selection and not filter_legit
falsepositives:
  - Security products, debuggers, and admin tools opening processes with broad access
  - Crash-dump and diagnostics tooling
level: high
