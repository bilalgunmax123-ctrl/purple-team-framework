name: Detection CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile testing/matrix_harness.py emulators/emit_synthetic_sysmon.py

      - name: Run detection matrix (offline check mode)
        run: python testing/matrix_harness.py --config testing/detection_matrix_config.json --check
